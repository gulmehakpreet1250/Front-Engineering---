<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Code Verse</title>

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    background: linear-gradient(to right,#CC86D1,#DCFFBD);
    min-height: 100vh; 
    display: flex;
    flex-direction: column;
}
nav{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:18px 50px;
    background:#d4b0ee;
}

nav h2{
    color:white;
    font-size:32px;
}

nav ul{
    display:flex;
    align-items:center;
    gap:35px;
    list-style:none;
}

nav ul li a{
    color:white;
    text-decoration:none;
    font-size:18px;
}
.icon{
    position:relative;
}

.icon i{
    font-size:28px;
    color:white;
}

.number{
    position:absolute;
    top:-8px;
    right:-10px;

    width:20px;
    height:20px;

    border-radius:50%;

    background:red;
    color:white;

    display:flex;
    justify-content:center;
    align-items:center;
} 
.form-container {
    flex-grow: 1; 
    display: flex;
    justify-content: center; 
    align-items: center;    
    padding: 20px;
}

.form{
    position: relative;
    width:500px;
    min-height:400px; 
    display:flex;
    flex-direction:column;
    justify-content:center;
    gap:10px;
    border-radius: 30px;
    /* border:2px solid black; */
    padding:20px;
    background: rgba(255, 255, 255, 0.2); 
    box-shadow:
        0 15px 40px rgba(0,0,0,0.25);
}
.form label{
    font-size: medium;
    font-family: cursive;

}
.form input{
    width: 100%;
    height: 50px;
    border-radius: 10px;
    font-size: medium;
    padding: 10px;
    font-family: cursive;
    border: none;
}

.form button{
    width: 100%;
    height: 50px;
    border-radius: 10px;
    font-size: medium;
    padding: 10px;
    background-color: #DCFFBD;
    font-family: cursive;
    border: none;
}
.form p{
    text-align: center;
    font-family: cursive;
}
.form h2{
    text-align: center;
    font-size: 50px;
    font-family: cursive;
    color:#DCFFBD;
}

nav h2{
    margin-right: 50px;
}
nav i{
    margin-left: 520px;
}
.close{
    position: absolute;
    top: 1.2rem;
    right: 1.5rem;

    font-size: 1.8rem;
    line-height: 1;

    padding: 0.2rem;
    border-radius: 50px;
    background: rgb(230, 223, 230);
    color: #161414;
}
</style>
</head>

<body>

<nav>
    <h2>Code Verse</h2>
    <ul>
        <li><a href="">PUSTAKALYA</a></li>
        <li><a href="">KAKSHA</a></li>
        <li><a href="">MESS</a></li>
        <li class="icon">
            <i class="fa-solid fa-thumbs-up"></i>
            <span class="number">12</span>
        </li>
    </ul>
</nav>

<div class="form-container">
    <form class="form">
        <span class="close" >&times;</span>
        <h2>WELCOME BACK!</h2>
        <p>Login to Continue</p>
        <label>Name:</label>
        <input type="text" placeholder="Enter your name.." required>
        
        <label>Password:</label>
        <input type="password" placeholder="Enter password.." required>
        <button>
            LOGIN
        </button>
        <p>Forgot Password?</p>
        <p>Don't have an account? <span style="color: #DCFFBD;">Sign up!</span></p>
    </form>
</div>

</body>
</html>
