<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meme Card</title>
    <link rel="stylesheet" href="style.css">
</head>
<style>
    *{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Gill Sans', 'Gill Sans MT', Calibri, 'Trebuchet MS', sans-serif;
}

body{
    background-color: #d5d7e9;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
}

.card{
    width:550px;
    background-color:#e4e5eb;
    border-radius:15px;
    overflow:hidden;
    box-shadow:10px 10px 5px rgba(0,0,0,0.2);
}
.card img{
    width:100%;
    height:550px;
    background-size:cover;
}

.content h3{
    padding:20px;
    text-align:center;
    color:#666;
}
</style>
<body>

    <div class="card">
        <div class="content">
            <h3>My Face when I remember <br> the "DUE" Date is next Week</h2>
        </div>
        <img src="WhatsApp Image 2026-07-16 at 1.46.53 PM.jpeg" alt="Meme">

        <div class="content">
            <h3>...and I haven't even named the file</p>
        </div>
    </div>

</body>
</html>
